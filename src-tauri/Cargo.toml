[package]
name = "notes"
version = "0.18.0"
description = "A lightweight Outline client"
authors = ["bayfield"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
keyring = "4"
url = "2"
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# Only to pick the TLS backend (see `run`); same version as reqwest's.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
# The Windows spell checker (same versions as Tauri's).
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com"] }
windows-core = "0.62"
windows-registry = "0.6"
windows-result = "0.4"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
