name: release

# Push a tag like v0.2.0 (matching "version" in package.json) to build the Windows
# installers and attach them to a draft GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Server pre-filled on the sign-in screen (optional).
          VITE_OUTLINE_URL: ${{ vars.VITE_OUTLINE_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Notes ${{ github.ref_name }}
          releaseBody: |
            Windows installers: `Notes_*_x64-setup.exe` (recommended) or the `.msi`.
            The installer isn't code-signed, so SmartScreen may ask you to confirm (More info → Run anyway).
          releaseDraft: true
