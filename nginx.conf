server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed assets never change.
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/app/doc/…) all load the app.
    location /app/ {
        try_files $uri /app/index.html;
        add_header Cache-Control "no-cache";
    }
}
